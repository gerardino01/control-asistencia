<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control de Asistencia · Marcaje con Cédula</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Librería para lectura de QR / Código de Barras -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  :root{
    --noche-900:#0F1B33; --noche-800:#16274A; --noche-700:#1E3260;
    --ambar-500:#F2A93B; --ambar-400:#F7C36B;
    --exito-600:#1E8E5A; --exito-500:#26A56A;
    --error-600:#C6394F; --error-500:#D64550;
    --hueso-50:#FAF8F3; --hueso-200:#E9E4D8;
    --tinta-700:#233248; --tinta-500:#5A6B85;
    --fuente-display:'Baloo 2', system-ui, sans-serif;
    --fuente-texto:'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:var(--fuente-texto);
    background:radial-gradient(1200px 600px at 50% -10%, var(--noche-700) 0%, var(--noche-900) 60%);
    color:var(--hueso-50);
    overflow:hidden;
    user-select:none;
  }

  .encabezado{ position:relative; padding:16px 24px 10px; text-align:center; }
  .encabezado .marca{
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--fuente-display); font-weight:700;
    font-size:clamp(18px, 3vw, 26px); color:var(--ambar-400); letter-spacing:.5px;
  }
  .encabezado .marca .punto{
    width:10px; height:10px; border-radius:50%; background:var(--exito-500);
    box-shadow:0 0 0 4px rgba(38,165,106,.18);
  }
  .encabezado .reloj{ margin-top:2px; font-size:clamp(13px, 2vw, 16px); color:var(--tinta-500); font-weight:600; }

  /* Selector de tipo de marcaje */
  .seccion-tipos{
    display:flex; justify-content:center; gap:8px;
    padding:4px 16px 12px; flex-wrap:wrap;
  }
  .btn-tipo{
    font-family:var(--fuente-texto); font-weight:700;
    font-size:clamp(12px, 1.6vw, 14px);
    color:var(--hueso-200);
    background:var(--noche-800);
    border:2px solid var(--noche-700);
    padding:8px 14px; border-radius:12px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn-tipo.activo{
    background:var(--ambar-500); color:var(--noche-900); border-color:var(--ambar-500);
  }

  /* Pestañas para alternar QR vs Teclado */
  .pestanas{
    display:flex; justify-content:center; gap:10px;
    padding:0 16px 8px;
  }
  .pestana{
    font-family:var(--fuente-texto); font-weight:700;
    font-size:clamp(13px, 1.8vw, 15px);
    color:var(--hueso-200); background:transparent;
    border:none; border-bottom:3px solid transparent;
    padding:6px 12px; cursor:pointer; opacity:.6;
  }
  .pestana.activa{
    color:var(--ambar-400); border-bottom-color:var(--ambar-400); opacity:1;
  }

  .contenedor{
    height:calc(100% - 170px);
    display:flex; align-items:center; justify-content:center;
    padding:0 20px 16px;
  }
  .vista{ display:none; width:100%; height:100%; align-items:center; justify-content:center; }
  .vista.activa{ display:flex; }

  .credencial{
    position:relative;
    width:min(92vw, 560px);
    background:linear-gradient(180deg, var(--noche-800), var(--noche-900));
    border-radius:28px; padding:20px;
    box-shadow:0 0 0 1px rgba(242,169,59,.15), 0 30px 60px -20px rgba(0,0,0,.6);
    text-align:center;
  }

  .instruccion{
    font-family:var(--fuente-display); font-weight:700;
    font-size:clamp(18px, 3.2vw, 24px); margin:0 0 2px; color:var(--hueso-50);
  }
  .subinstruccion{
    font-size:clamp(12px, 2vw, 14px); color:var(--tinta-500);
    margin-bottom:12px; font-weight:500;
  }

  /* Marco de cámara QR */
  .marco-camara{
    position:relative; width:100%; aspect-ratio:1/1; max-height:36vh;
    margin:0 auto; border-radius:20px; overflow:hidden; background:#000;
    border:3px solid var(--ambar-500);
  }
  #lector-camara{ width:100%; height:100%; }
  #lector-camara video{ object-fit:cover !important; width:100% !important; height:100% !important; }

  .esquina{ position:absolute; width:28px; height:28px; border-color:var(--ambar-400); border-style:solid; z-index:5; pointer-events:none; opacity:.9; }
  .esquina.tl{ top:10px; left:10px; border-width:4px 0 0 4px; border-radius:8px 0 0 0;}
  .esquina.tr{ top:10px; right:10px; border-width:4px 4px 0 0; border-radius:0 8px 0 0;}
  .esquina.bl{ bottom:10px; left:10px; border-width:0 0 4px 4px; border-radius:0 0 0 8px;}
  .esquina.br{ bottom:10px; right:10px; border-width:0 4px 4px 0; border-radius:0 0 8px 0;}

  .linea-scan{
    position:absolute; left:8%; right:8%; top:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--ambar-400), transparent);
    z-index:6; animation:barrido 2.4s ease-in-out infinite; pointer-events:none;
  }
  @keyframes barrido{ 0%{top:8%;opacity:0;} 10%{opacity:1;} 50%{top:92%;opacity:1;} 60%{opacity:0;} 100%{top:8%;opacity:0;} }

  .estado-camara{ margin-top:10px; font-size:13px; color:var(--tinta-500); font-weight:600; min-height:18px; }

  .boton-grande{
    margin-top:12px; width:100%;
    font-family:var(--fuente-display); font-weight:700;
    font-size:clamp(16px, 2.8vw, 18px);
    padding:14px; border-radius:14px; border:none;
    background:var(--ambar-500); color:var(--noche-900);
    cursor:pointer; transition:transform .1s ease;
  }
  .boton-grande:active{ transform:scale(.97); }

  /* Teclado numérico */
  .pantalla-teclado{ font-family:var(--fuente-display); font-weight:700; font-size:clamp(24px, 5vw, 34px); letter-spacing:2px; background:var(--noche-900); border:2px solid var(--noche-700); border-radius:14px; padding:10px; margin-bottom:10px; min-height:52px; color:var(--hueso-50); }
  .pantalla-teclado.vacio{ color:var(--tinta-500); font-size:clamp(15px,2.5vw,18px); }
  .grid-teclado{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tecla{
    font-family:var(--fuente-display); font-weight:700; font-size:clamp(20px,3.5vw,26px);
    padding:12px 0; border-radius:12px; border:none;
    background:var(--noche-700); color:var(--hueso-50); cursor:pointer;
  }
  .tecla:active{ background:var(--ambar-500); color:var(--noche-900); }
  .tecla.accion{ font-size:clamp(13px,2vw,15px); background:var(--noche-800); color:var(--tinta-500); }

  /* Overlay procesando */
  .overlay-procesando{
    position:absolute; inset:0; background:rgba(15,27,51,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    border-radius:20px; z-index:20; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay-procesando.activo{ opacity:1; pointer-events:all; }
  .spinner{ width:48px; height:48px; border-radius:50%; border:5px solid rgba(247,195,107,.25); border-top-color:var(--ambar-400); animation:girar .8s linear infinite; }
  @keyframes girar{ to{ transform:rotate(360deg); } }
  .overlay-procesando span{ font-family:var(--fuente-display); font-weight:600; font-size:16px; color:var(--hueso-50); text-align:center; }

  /* Pantalla de resultado */
  .pantalla-resultado{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:32px; z-index:50;
    opacity:0; transform:scale(.96); pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .pantalla-resultado.visible{ opacity:1; transform:scale(1); pointer-events:all; }
  .pantalla-resultado.exito{ background:radial-gradient(1200px 700px at 50% 0%, var(--exito-500) 0%, var(--exito-600) 55%, #0d5c39 100%); }
  .pantalla-resultado.error{ background:radial-gradient(1200px 700px at 50% 0%, var(--error-500) 0%, var(--error-600) 55%, #7d1e2c 100%); }

  .icono-resultado{
    width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; border:4px solid rgba(255,255,255,.55);
    animation:pop .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ 0%{transform:scale(.5);opacity:0;} 100%{transform:scale(1);opacity:1;} }
  .icono-resultado svg{ width:50px; height:50px; }

  .resultado-nombre{ font-family:var(--fuente-display); font-weight:800; font-size:clamp(26px,5vw,42px); line-height:1.05; color:#fff; }
  .resultado-tipo{ display:inline-block; font-family:var(--fuente-display); font-weight:700; font-size:clamp(15px,2.8vw,22px); letter-spacing:1px; background:rgba(255,255,255,.22); padding:8px 24px; border-radius:999px; color:#fff; }
  .resultado-hora{ font-size:clamp(14px,2.2vw,18px); color:rgba(255,255,255,.85); font-weight:600; }
  .resultado-mensaje{ font-size:clamp(16px,2.5vw,20px); color:#fff; font-weight:700; }

  .barra-progreso{ position:absolute; bottom:0; left:0; height:6px; background:rgba(255,255,255,.65); width:100%; transform-origin:left; animation:vaciar 3s linear forwards; }
  @keyframes vaciar{ from{transform:scaleX(1);} to{transform:scaleX(0);} }

  .pie{ position:fixed; bottom:8px; left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,.25); }
</style>
</head>
<body>

  <header class="encabezado">
    <div class="marca"><span class="punto"></span> Control de Asistencia</div>
    <div class="reloj" id="reloj">--:--:--</div>
  </header>

  <!-- Selector para el tipo de marcaje -->
  <div class="seccion-tipos">
    <button class="btn-tipo activo" onclick="seleccionarTipo('ENTRADA', this)">ENTRADA</button>
    <button class="btn-tipo" onclick="seleccionarTipo('INICIO_ALMUERZO', this)">INICIO ALMUERZO</button>
    <button class="btn-tipo" onclick="seleccionarTipo('FIN_ALMUERZO', this)">FIN ALMUERZO</button>
    <button class="btn-tipo" onclick="seleccionarTipo('SALIDA', this)">SALIDA</button>
  </div>

  <nav class="pestanas">
    <button class="pestana activa" id="tabQr" onclick="cambiarModo('qr')">📷 Código QR</button>
    <button class="pestana" id="tabTeclado" onclick="cambiarModo('teclado')">⌨️ Digitar Cédula</button>
  </nav>

  <main class="contenedor">

    <!-- MODO 1: LECTOR QR -->
    <section class="vista activa" id="vistaQr">
      <div class="credencial">
        <h1 class="instruccion">Escanee su código QR</h1>
        <p class="subinstruccion">Alinee el código dentro del recuadro</p>
        <div class="marco-camara">
          <div id="lector-camara"></div>
          <div class="esquina tl"></div><div class="esquina tr"></div>
          <div class="esquina bl"></div><div class="esquina br"></div>
          <div class="linea-scan"></div>
          <div class="overlay-procesando" id="overlayProcesando">
            <div class="spinner"></div><span>Procesando...</span>
          </div>
        </div>
        <p class="estado-camara" id="estadoCamara">Iniciando cámara…</p>
      </div>
    </section>

    <!-- MODO 2: TECLADO NUMÉRICO -->
    <section class="vista" id="vistaTeclado">
      <div class="credencial">
        <h1 class="instruccion">Escriba su número de cédula</h1>
        <p class="subinstruccion">Ingrese los dígitos y presione Marcar</p>
        <div class="pantalla-teclado vacio" id="pantallaTeclado">Ej. 1-2345-6789</div>
        <div class="grid-teclado">
          <button class="tecla" onclick="teclaPresionada('1')">1</button>
          <button class="tecla" onclick="teclaPresionada('2')">2</button>
          <button class="tecla" onclick="teclaPresionada('3')">3</button>
          <button class="tecla" onclick="teclaPresionada('4')">4</button>
          <button class="tecla" onclick="teclaPresionada('5')">5</button>
          <button class="tecla" onclick="teclaPresionada('6')">6</button>
          <button class="tecla" onclick="teclaPresionada('7')">7</button>
          <button class="tecla" onclick="teclaPresionada('8')">8</button>
          <button class="tecla" onclick="teclaPresionada('9')">9</button>
          <button class="tecla accion" onclick="borrarTeclado()">⌫ Borrar</button>
          <button class="tecla" onclick="teclaPresionada('0')">0</button>
          <button class="tecla accion" onclick="limpiarTeclado()">✕ Limpiar</button>
        </div>
        <button class="boton-grande" onclick="enviarDesdeTeclado()">Marcar</button>
      </div>
    </section>

  </main>

  <!-- Pantalla de resultado -->
  <div class="pantalla-resultado" id="pantallaResultado">
    <div class="icono-resultado" id="iconoResultado"></div>
    <div class="resultado-nombre" id="resultadoNombre"></div>
    <div class="resultado-tipo" id="resultadoTipo"></div>
    <div class="resultado-hora" id="resultadoHora"></div>
    <div class="resultado-mensaje" id="resultadoMensaje" style="display:none;"></div>
    <div class="barra-progreso" id="barraProgreso"></div>
  </div>

  <div class="pie">Sistema de Asistencia · QR & Teclado</div>

<script>
/* =========================================================================
   CONFIGURACIÓN Y ESTADO
   ========================================================================= */
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX/exec';
const TIEMPO_RESULTADO_MS = 3000;

let tipoSeleccionado = 'ENTRADA';
let modoActual = 'qr';
let lectorQr = null;
let camaraLista = false;
let escaneando = false;
let cedulaTecladoActual = '';

const elReloj = document.getElementById('reloj');
const elPantallaResultado = document.getElementById('pantallaResultado');
const elIconoResultado    = document.getElementById('iconoResultado');
const elResultadoNombre   = document.getElementById('resultadoNombre');
const elResultadoTipo     = document.getElementById('resultadoTipo');
const elResultadoHora     = document.getElementById('resultadoHora');
const elResultadoMensaje  = document.getElementById('resultadoMensaje');
const elBarraProgreso     = document.getElementById('barraProgreso');

/* =========================================================================
   SELECCIÓN DE TIPO Y MODO
   ========================================================================= */
function seleccionarTipo(tipo, boton){
  tipoSeleccionado = tipo;
  document.querySelectorAll('.btn-tipo').forEach(b => b.classList.remove('activo'));
  boton.classList.add('activo');
}

function cambiarModo(modo){
  if (modo === modoActual) return;

  document.getElementById('vistaQr').classList.toggle('activa', modo === 'qr');
  document.getElementById('vistaTeclado').classList.toggle('activa', modo === 'teclado');

  document.getElementById('tabQr').classList.toggle('activa', modo === 'qr');
  document.getElementById('tabTeclado').classList.toggle('activa', modo === 'teclado');

  modoActual = modo;

  if (modo === 'qr') reanudarCamara();
  else pausarCamara();
}

/* =========================================================================
   RELOJ Y SONIDOS
   ========================================================================= */
function actualizarReloj(){
  elReloj.textContent = new Date().toLocaleTimeString('es-CR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
setInterval(actualizarReloj, 1000);
actualizarReloj();

let contextoAudio = null;
function reproducirTono(frecuencia, duracionMs, tipoOnda, inicioMs){
  if (!contextoAudio) contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
  const inicio = contextoAudio.currentTime + (inicioMs || 0) / 1000;
  const osc = contextoAudio.createOscillator();
  const gan = contextoAudio.createGain();
  osc.type = tipoOnda || 'sine';
  osc.frequency.setValueAtTime(frecuencia, inicio);
  gan.gain.setValueAtTime(0.0001, inicio);
  gan.gain.exponentialRampToValueAtTime(0.35, inicio + 0.02);
  gan.gain.exponentialRampToValueAtTime(0.0001, inicio + duracionMs / 1000);
  osc.connect(gan); gan.connect(contextoAudio.destination);
  osc.start(inicio); osc.stop(inicio + duracionMs / 1000 + 0.02);
}
function sonidoExito(){ reproducirTono(880, 120, 'sine', 0); reproducirTono(1318, 180, 'sine', 130); }
function sonidoError(){ reproducirTono(220, 260, 'sawtooth', 0); reproducirTono(170, 320, 'sawtooth', 220); }

const SVG_CHECK = `<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SVG_EQUIS  = `<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* =========================================================================
   LECTOR QR
   ========================================================================= */
function iniciarLectorQr(){
  lectorQr = new Html5Qrcode('lector-camara', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose:false });
  const config = { fps: 12, qrbox: (w, h) => { const t = Math.floor(Math.min(w, h) * 0.75); return { width: t, height: t }; }, aspectRatio: 1.0 };

  lectorQr.start({ facingMode:'environment' }, config, onLecturaExitosa, () => {})
    .then(() => {
      camaraLista = true;
      document.getElementById('estadoCamara').textContent = 'Listo para escanear QR';
    })
    .catch(err => {
      document.getElementById('estadoCamara').textContent = 'No se pudo acceder a la cámara.';
    });
}

async function onLecturaExitosa(texto){
  if (escaneando || modoActual !== 'qr') return;
  escaneando = true;
  await pausarCamara();
  mostrarOverlay(true);

  try {
    const respuesta = await enviarMarcaje((texto || '').trim());
    manejarRespuesta(respuesta, () => mostrarOverlay(false), reanudarCamara);
  } catch (error) {
    manejarRespuesta({ status:'ERROR', message:'No se pudo conectar con el servidor.' }, () => mostrarOverlay(false), reanudarCamara);
  }
}

async function pausarCamara(){ try { if (lectorQr && camaraLista) await lectorQr.pause(true); } catch(e){} }
async function reanudarCamara(){ try { if (lectorQr && camaraLista) await lectorQr.resume(); } catch(e){} escaneando = false; }

/* =========================================================================
   TECLADO NUMÉRICO
   ========================================================================= */
function actualizarPantallaTeclado(){
  const el = document.getElementById('pantallaTeclado');
  if (!cedulaTecladoActual) {
    el.textContent = 'Ej. 1-2345-6789';
    el.classList.add('vacio');
  } else {
    el.textContent = cedulaTecladoActual;
    el.classList.remove('vacio');
  }
}
function teclaPresionada(d){ if(cedulaTecladoActual.length < 12) cedulaTecladoActual += d; actualizarPantallaTeclado(); }
function borrarTeclado(){ cedulaTecladoActual = cedulaTecladoActual.slice(0, -1); actualizarPantallaTeclado(); }
function limpiarTeclado(){ cedulaTecladoActual = ''; actualizarPantallaTeclado(); }

async function enviarDesdeTeclado(){
  if (!cedulaTecladoActual || cedulaTecladoActual.length < 6) return;
  const cedula = cedulaTecladoActual;
  limpiarTeclado();

  try {
    const respuesta = await enviarMarcaje(cedula);
    manejarRespuesta(respuesta, () => {}, () => {});
  } catch (error) {
    manejarRespuesta({ status:'ERROR', message:'No se pudo conectar con el servidor.' }, () => {}, () => {});
  }
}

/* =========================================================================
   BACKEND Y MUESTRA DE RESULTADOS
   ========================================================================= */
async function enviarMarcaje(cedula){
  const respuesta = await fetch(URL_APPS_SCRIPT, {
    method: 'POST',
    mode: 'cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ cedula: cedula, tipo: tipoSeleccionado })
  });
  if (!respuesta.ok) throw new Error('Respuesta no válida: ' + respuesta.status);
  return respuesta.json();
}

function mostrarOverlay(activo){ document.getElementById('overlayProcesando').classList.toggle('activo', activo); }

const ETIQUETAS_TIPO = {
  ENTRADA:'ENTRADA', INICIO_ALMUERZO:'INICIO DE ALMUERZO',
  FIN_ALMUERZO:'FIN DE ALMUERZO', SALIDA:'SALIDA'
};

function manejarRespuesta(respuesta, ocultarOverlay, alTerminar){
  ocultarOverlay();

  if (respuesta && respuesta.status === 'SUCCESS') {
    sonidoExito();
    elPantallaResultado.className = 'pantalla-resultado exito visible';
    elIconoResultado.innerHTML = SVG_CHECK;
    elResultadoNombre.textContent = respuesta.nombre || '';
    elResultadoTipo.textContent = ETIQUETAS_TIPO[respuesta.tipo] || respuesta.tipo;
    elResultadoHora.textContent = 'Hora: ' + (respuesta.hora || '');
    elResultadoMensaje.style.display = 'none';
  } else {
    sonidoError();
    elPantallaResultado.className = 'pantalla-resultado error visible';
    elIconoResultado.innerHTML = SVG_EQUIS;
    elResultadoNombre.textContent = respuesta.status === 'NOT_FOUND' ? 'Cédula no registrada' : 'Error al registrar';
    elResultadoMensaje.textContent = respuesta.message || 'Intente de nuevo.';
    elResultadoMensaje.style.display = 'block';
  }

  setTimeout(() => {
    elPantallaResultado.classList.remove('visible');
    alTerminar();
  }, TIEMPO_RESULTADO_MS);
}

/* ARRANQUE INICIAL */
window.addEventListener('load', iniciarLectorQr);
</script>
</body>
</html>
